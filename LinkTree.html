<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links & Contact</title>
    <!-- Font Awesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Dark Gaming Green Theme */
        body {
            background: linear-gradient(135deg, #04140e 0%, #0a261c 50%, #020d09 100%);
            color: #ecfdf5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        /* 1:1 Square Grid for Social Cards (2 rows x 3 columns) */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .square-card {
            aspect-ratio: 1 / 1;
            background: rgba(15, 45, 33, 0.75);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: floatPulse 4s ease-in-out infinite alternate;
        }

        .square-card:nth-child(even) {
            animation-delay: 0.6s;
        }

        .square-card i, .square-card svg {
            font-size: 30px;
            width: 30px;
            height: 30px;
            margin-bottom: 8px;
            transition: transform 0.3s ease, fill 0.3s ease, color 0.3s ease;
        }

        .square-card span {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #a7f3d0;
        }

        /* Hover & Animation Effects for Social Cards */
        .square-card:hover {
            transform: translateY(-6px) scale(1.04);
            border-color: #10b981;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
            background: rgba(20, 60, 44, 0.95);
        }

        .square-card:hover i, .square-card:hover svg {
            transform: scale(1.15);
        }

        /* Brand Colors on Hover */
        .whatsapp:hover i { color: #25D366; }
        .linkedin:hover i { color: #0A66C2; }
        .youtube:hover i { color: #FF0000; }
        .facebook:hover i { color: #1877F2; }
        .instagram:hover i { color: #E4405F; }
        .kick:hover svg { fill: #53FC18; } /* Kick Neon Green */

        /* Bottom Inquiry Section */
        .inquiry-section {
            border-top: 1px solid rgba(16, 185, 129, 0.2);
            padding-top: 25px;
        }

        .inquiry-title {
            font-size: 13px;
            color: #6ee7b7;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 18px;
            font-weight: 600;
        }

        /* Animated Action Buttons */
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border: 1px solid #10b981;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        /* Light Shine Effect Animation */
        .action-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transform: rotate(30deg);
            animation: shine 3.5s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(30deg); }
            20% { transform: translateX(100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        @keyframes floatPulse {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-4px); }
        }

        /* Mobile Layout Adjustment */
        @media (max-width: 360px) {
            .social-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1:1 Aspect Ratio Social Grid (6 Platforms) -->
        <div class="social-grid">
            
            <!-- WhatsApp -->
            <a href="https://wa.me/919140085319" target="_blank" class="square-card whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>

            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/iklapikla/" target="_blank" class="square-card linkedin">
                <i class="fa-brands fa-linkedin-in"></i>
                <span>LinkedIn</span>
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@Piklaa" target="_blank" class="square-card youtube">
                <i class="fa-brands fa-youtube"></i>
                <span>YouTube</span>
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/profile.php?id=61593827721409" target="_blank" class="square-card facebook">
                <i class="fa-brands fa-facebook-f"></i>
                <span>Facebook</span>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/_pikla__/" target="_blank" class="square-card instagram">
                <i class="fa-brands fa-instagram"></i>
                <span>Instagram</span>
            </a>

            <!-- Kick.com -->
            <a href="https://kick.com/piklaaa" target="_blank" class="square-card kick">
                <svg viewBox="0 0 24 24" fill="#ffffff">
                    <path d="M3 3h4.5v6h3V6h3V3H18v6h-3v3h3v3h3v6h-4.5v-6h-3v3h-3v3H3V3z"/>
                </svg>
                <span>Kick</span>
            </a>

        </div>

        <!-- Inquiries Section with Pre-filled Messages -->
        <div class="inquiry-section">
            <p class="inquiry-title">For inquiries, please contact below</p>

            <!-- Contact for Production Button -->
            <a href="https://wa.me/919140085319?text=I%20want%20to%20contact%20for%20production" target="_blank" class="action-btn">
                <i class="fa-brands fa-whatsapp"></i>
                Contact for Production
            </a>

            <!-- Contact for Free Fire Female Caster Button -->
            <a href="https://wa.me/919140085319?text=I%20want%20to%20connect%20for%20Free%20Fire%20female%20caster" target="_blank" class="action-btn">
                <i class="fa-brands fa-whatsapp"></i>
                Contact for Free Fire Female Caster
            </a>
        </div>

    </div>

</body>
</html>
